name: publish

# eli5.sok.lv publishing (2026-11-02). Groundwork stage: deploy the static
# landing as-is. The content machine (video -> page generator, drip) will be
# adapted from the book850 pattern later; this workflow keeps working unchanged
# as long as the site stays a static tree in repo root.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
